name: Test Market Cap

# curl_cffi 로 KIND 상세(상장주식수) 접근이 되는지 검증하는 임시 워크플로.
# Actions 탭에서 수동 실행 후 로그 확인.

on:
  workflow_dispatch:

jobs:
  testmcap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Test market cap fetch
        run: python ipo_alert.py testmcap
